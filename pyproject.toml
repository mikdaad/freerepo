[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2ai"
version = "1.0.0"
description = "Lossless AutoCAD DWG extraction (ezdxf + odafc) into a token-budgeted JSON payload for DeepSeek analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.1,<2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cad2ai = "cad2ai.cli:main"

[tool.setuptools]
packages = ["cad2ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 118
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "UP006",  # keep typing.List-style annotations valid on 3.9
    "UP007",  # `X | Y` in annotations is fine here (from __future__ import annotations)
    "E501",   # long docstring lines are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
